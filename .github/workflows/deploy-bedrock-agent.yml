name: Deploy Bedrock Agent

"on":
  workflow_dispatch:
    inputs:
      script_path:
        description: "Path to a .py agent script under python/ (with or without a leading python/)"
        required: false
        default: "m1/m1.5_homework_filled.py"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-bedrock-agent-${{ github.ref }}-${{ github.event.inputs.script_path || vars.BEDROCK_AGENT_SCRIPT || 'm1/m1.5_homework_filled.py' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    env:
      AWS_REGION: ${{ vars.AWS_REGION || vars.AWS_DEFAULT_REGION || 'us-east-2' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID || 'anthropic.claude-3-5-haiku-20241022-v1:0' }}
      BEDROCK_STRONG_MODEL_ID: ${{ vars.BEDROCK_STRONG_MODEL_ID || vars.BEDROCK_MODEL_ID || 'anthropic.claude-3-5-sonnet-20240620-v1:0' }}
      LCA_MODEL_PROVIDER: bedrock
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT || 'lca-deepagents' }}
      LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING || 'false' }}
      PYTHONPATH: ${{ github.workspace }}/python
      SCRIPT_PATH: ${{ github.event.inputs.script_path || vars.BEDROCK_AGENT_SCRIPT || 'm1/m1.5_homework_filled.py' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --extra bedrock

      - name: Validate workflow configuration
        run: |
          echo "Resolved SCRIPT_PATH=$SCRIPT_PATH"
          if [ -z "$AWS_ROLE_TO_ASSUME" ]; then
            echo "Repository variable AWS_ROLE_TO_ASSUME must be set before this workflow can assume an AWS role." >&2
            exit 1
          fi
          if ! [[ "$AWS_ROLE_TO_ASSUME" =~ ^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]]; then
            echo "Repository variable AWS_ROLE_TO_ASSUME must be a valid IAM role ARN (format: arn:aws:iam::<12-digit-account-id>:role/<role-name-or-path>). Got: $AWS_ROLE_TO_ASSUME" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          root = Path.cwd().resolve()
          raw_script_path = os.environ["SCRIPT_PATH"].strip()

          if not raw_script_path:
              print("SCRIPT_PATH must not be empty.", file=sys.stderr)
              raise SystemExit(1)

          requested_path = Path(raw_script_path)
          if requested_path.is_absolute():
              print(
                  "SCRIPT_PATH must be a relative path under python/, "
                  f"got absolute path {raw_script_path!r}.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          if requested_path.parts[:1] == ("python",):
              requested_path = Path(*requested_path.parts[1:])

          if not requested_path.parts:
              print(
                  "SCRIPT_PATH must point to a .py file under python/.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          script_path = (root / requested_path).resolve()

          try:
              relative_script_path = script_path.relative_to(root)
          except ValueError:
              print(
                  "SCRIPT_PATH must stay within the python/ directory; "
                  f"got {raw_script_path!r}.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          if script_path.suffix != ".py":
              print(
                  "SCRIPT_PATH must be a filesystem path to a .py file under python/, "
                  "not a module name.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          if not script_path.is_file():
              print(
                  f"Agent script not found at {relative_script_path}",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as github_env:
              github_env.write(f"SCRIPT_PATH={relative_script_path.as_posix()}\n")

          print(f"Validated script path: {relative_script_path}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deepagent against Bedrock
        run: uv run python "$SCRIPT_PATH"
