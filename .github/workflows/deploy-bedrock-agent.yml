name: Deploy Bedrock Agent

"on":
  workflow_dispatch:
    inputs:
      script_path:
        description: "Path to a .py agent script relative to python/"
        required: false
        default: "m1/m1.5_homework.py"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-bedrock-agent-${{ github.ref }}-${{ github.event.inputs.script_path || vars.BEDROCK_AGENT_SCRIPT || 'm1/m1.5_homework.py' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    env:
      AWS_REGION: ${{ vars.AWS_REGION || vars.AWS_DEFAULT_REGION || 'us-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID || 'anthropic.claude-3-5-haiku-20241022-v1:0' }}
      BEDROCK_STRONG_MODEL_ID: ${{ vars.BEDROCK_STRONG_MODEL_ID || vars.BEDROCK_MODEL_ID || 'anthropic.claude-3-5-sonnet-20240620-v1:0' }}
      LCA_MODEL_PROVIDER: bedrock
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT || 'lca-deepagents' }}
      LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING || 'false' }}
      PYTHONPATH: ${{ github.workspace }}/python
      SCRIPT_PATH: ${{ github.event.inputs.script_path || vars.BEDROCK_AGENT_SCRIPT || 'm1/m1.5_homework.py' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --extra bedrock

      - name: Validate workflow configuration
        run: |
          echo "Resolved SCRIPT_PATH=$SCRIPT_PATH"
          if [ -z "$AWS_ROLE_TO_ASSUME" ]; then
            echo "Repository variable AWS_ROLE_TO_ASSUME must be set before this workflow can assume an AWS role." >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          root = Path.cwd().resolve()
          raw_script_path = os.environ["SCRIPT_PATH"]
          script_path = (root / raw_script_path).resolve()

          try:
              script_path.relative_to(root)
          except ValueError:
              print(
                  "SCRIPT_PATH must stay within the python/ directory; "
                  f"got {raw_script_path!r}.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          if script_path.suffix != ".py":
              print(
                  "SCRIPT_PATH must be a filesystem path to a .py file under python/, "
                  "not a module name.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          if not script_path.is_file():
              print(
                  f"Agent script not found at {script_path.relative_to(root)}",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print(f"Validated script path: {script_path.relative_to(root)}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deepagent against Bedrock
        run: uv run python "$SCRIPT_PATH"
